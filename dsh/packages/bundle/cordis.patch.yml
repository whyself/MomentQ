# MomentQ Host state and Session routing. DSH_HOME is validated by the service.
- insert:
    - id: momentq-host
      name: momentq-dsh-bundle
      config:
        root: !!js process.env.MOMENTQ_DATA_ROOT

    - id: momentq-http-api
      name: momentq-dsh-bundle/http-api

# New MomentQ Sessions use the image-capable DeepSeek route by default.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

# Web disables model-facing filesystem tools globally. Restore the native
# implementations; the MomentQ Agent scope hides everything except exact-file
# wrappers for grep and read.
- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

# The shipped MomentQ roster is the only composition source.
- id: agent-presets
  disabled: true

- insert:
    - id: momentq-agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      inject: [momentq]
      config:
        default: momentq
        roots:
          - path: !!js ctx.momentq.presetRoot
            trust: system
        includeUserRoot: false

# There are no mutating model tools, and no wider permission target is exposed.
# The tool registry itself is restricted to two exact-file READ wrappers over
# the session's own transcript (tool-policy), so the agent has no mutation
# surface regardless of the OS sandbox. On Windows the read-only sandbox
# spawns children under a CreateRestrictedToken, and the packaged ripgrep
# dies under that token with STATUS_DLL_INIT_FAILED (0xC0000142, measured
# 2026-08-31) — which broke the only tools the agent has. POSIX sandboxes
# confine spawns without this failure, so they stay.
- id: permission
  config:
    presets:
      read-only:
        sandbox: !!js |
          process.platform === 'win32' ? 'danger-full-access' : 'read-only'
        approval: ask
    defaultPreset: read-only
